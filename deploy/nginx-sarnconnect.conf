# Nginx config for SarnConnect — frontend (static SPA) + backend (reverse proxy).
#
# Install: sudo cp deploy/nginx-sarnconnect.conf /etc/nginx/sites-available/sarnconnect
#          sudo ln -s /etc/nginx/sites-available/sarnconnect /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see deploy guide) — it will rewrite the listen directives to add SSL.

# ── Frontend: sarnconnect.in ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sarnconnect.in www.sarnconnect.in;

    root /var/www/sarnconnect/frontend/dist;
    index index.html;

    # SPA fallback — same reason the Hostinger .htaccess exists: client-side routes
    # like /privacy-policy have no matching file, so serve index.html and let
    # React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Backend API + webhook: api.sarnconnect.in ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.sarnconnect.in;

    client_max_body_size 20M;   # media uploads (images/docs) go through this API

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for Socket.IO (WebSocket upgrade) — without this, real-time
        # inbox updates silently fall back to polling or fail entirely.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
    }
}
